name: cd_castellon
description: Cd Castellón

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  get: ^3.13.2
  ff_navigation_bar: ^0.1.5
  flutter_html: ^0.11.0
  pull_to_refresh: ^1.6.2
  cached_network_image: ^2.3.3
  photo_view: ^0.10.2
  url_launcher: ^5.7.5
  timeline_tile: ^1.0.0
  font_awesome_flutter: ^8.10.0
  share: ^0.6.5+3
  auto_size_text: ^2.1.0
  get_storage: ^1.3.1
  carousel_slider: ^2.3.1
  flutter_native_admob: ^2.1.0+3
  flutter_youtube: ^2.0.0+1
  twitter_api: ^0.1.2
  tweet_ui: ^2.3.0+1

  curved_navigation_bar: ^0.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.8.1
  flutter_launcher_name: ^0.0.1

flutter_launcher_name:
  name: "CD Castellón"

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/logocuadrado.png"


flutter:

  uses-material-design: true

  assets:
    - data/
    - assets/football/
    - assets/icon/
    - assets/images/
    - assets/jugadores/
    - assets/

